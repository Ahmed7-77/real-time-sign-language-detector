name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t sign-language-detector .

      - name: Verify image runs
        run: docker run --rm sign-language-detector python -c "import cv2, tensorflow; print('Dependencies OK')"